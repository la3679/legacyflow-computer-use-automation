name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: xvfb-run -a uv run --no-sync pytest -q
  replay-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/check_replay_only.py
