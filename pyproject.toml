[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacyflow"
version = "0.1.0"
description = "Discover UI capabilities with an LLM; replay them deterministically."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.20", "playwright>=1.50,<2", "python-dotenv>=1.1,<2", "typer>=0.16,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
discovery = ["openai>=3.11,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
legacyflow = "legacyflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/legacyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/legacyflow"]

